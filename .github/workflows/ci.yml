name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest
      - name: Migrations are committed
        run: DEBUG=true python manage.py makemigrations --check --dry-run

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Images are built here, never on the server. Pull requests only build them;
  # pushes to main publish them to GitHub's container registry (ghcr.io) and
  # then ask Coolify to redeploy.
  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4

      - name: Compose files are valid
        run: |
          SECRET_KEY=x DB_PASSWORD=x docker compose -f docker-compose.coolify.yaml config -q
          touch .env && docker compose -f docker-compose-prod.yaml config -q

      - uses: docker/setup-buildx-action@v3

      # Start the real images and check them before anything is published.
      - name: Build images for the smoke test
        run: |
          docker buildx build --load -t projvitrine-backend:test -f backend/Dockerfile.prod \
            --cache-from type=gha,scope=backend backend
          docker buildx build --load -t projvitrine-web:test -f frontend/Dockerfile \
            --cache-from type=gha,scope=web frontend

      - name: Smoke test
        run: |
          set -eux
          docker network create smoke
          # a root-owned media directory, as a fresh volume can be on Coolify
          MEDIA=$(mktemp -d) && sudo chown root:root "$MEDIA" && sudo chmod 755 "$MEDIA"
          docker run -d --name projvitrine-backend --network smoke -v "$MEDIA":/usr/src/app/media \
            -e SECRET_KEY=smoke-test-secret-key-long-enough-for-hs256 \
            -e DATABASE_URL=sqlite:////tmp/db.sqlite3 \
            -e SITE_URL=https://projvitrine.example \
            -e INDEX_HTML_URL=http://projvitrine-web:8080/index.html \
            projvitrine-backend:test
          for i in $(seq 1 30); do
            docker exec projvitrine-backend python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/')" && break
            sleep 2
          done
          # gunicorn runs unprivileged and can write uploads to the media volume
          test "$(docker exec projvitrine-backend stat -c %U /proc/1)" = app
          docker exec -u app projvitrine-backend touch media/project_images/upload-check
          docker run -d --name projvitrine-web --network smoke -p 8080:8080 \
            -e BACKEND_UPSTREAM=projvitrine-backend:8000 \
            -e SITE_URL=https://projvitrine.example -e CANONICAL_HOST=projvitrine.example \
            -e VITE_BRAND_NAME='ProjVitrine & Co' -e SOCIAL_AUTH_GITHUB_KEY=client123 \
            projvitrine-web:test
          for i in $(seq 1 15); do curl -fs http://127.0.0.1:8080/healthz && break; sleep 1; done
          H="Host: projvitrine.example"
          curl -fs -H "$H" http://127.0.0.1:8080/ | grep -q '<title>ProjVitrine &amp; Co</title>'
          curl -fs -H "$H" http://127.0.0.1:8080/config.js | grep -q '"githubClientId": "client123"'
          curl -fs -H "$H" http://127.0.0.1:8080/api/health/ | grep -q '"ok"'
          curl -sI -H "$H" http://127.0.0.1:8080/portfolios/someone | grep -qi '^location: /u/someone'
          # the backend fetches index.html from the web container by its service name: no redirect
          docker exec projvitrine-backend python -c "import urllib.request; assert urllib.request.urlopen('http://projvitrine-web:8080/index.html').status == 200"
          # link-preview tags for a real portfolio page
          docker exec -u app projvitrine-backend python manage.py shell -c "from django.contrib.auth.models import User; from backend.models import Profile; u = User.objects.create(username='smoke'); Profile.objects.create(user=u, full_name='Smoke Test', headline='Tester')"
          curl -fs -H "$H" http://127.0.0.1:8080/u/smoke | grep -q '<title>Smoke Test · Tester</title>'
          test "$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' -H 'Host: alxhof.kndev.org' http://127.0.0.1:8080/u/x)" = "301 https://projvitrine.example/u/x"
          # unknown portfolio: Django 404s, nginx falls back to the app shell
          curl -fs -H "$H" http://127.0.0.1:8080/u/nobody | grep -q '<div id="root">'

      - name: Smoke test logs
        if: failure()
        run: docker logs projvitrine-backend; docker logs projvitrine-web

      - name: Log in to ghcr.io
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.prod
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ${{ env.REGISTRY }}/projvitrine-backend:latest
            ${{ env.REGISTRY }}/projvitrine-backend:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ${{ env.REGISTRY }}/projvitrine-web:latest
            ${{ env.REGISTRY }}/projvitrine-web:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # Optional: set COOLIFY_WEBHOOK (the resource's Deploy Webhook URL) and
      # COOLIFY_TOKEN (an API token) as repository secrets to deploy automatically.
      - name: Trigger Coolify deployment
        if: env.PUBLISH == 'true'
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ]; then
            echo "COOLIFY_WEBHOOK not set; images are published, deploy from Coolify manually."
            exit 0
          fi
          curl --fail --silent --show-error -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_WEBHOOK"
