# Production stack (current droplet). Coolify will run the same images.
services:
  db:
    restart: always
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    restart: always
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    env_file:
      - .env
    volumes:
      - media_data:/usr/src/app/media
      - static_data:/usr/src/app/static
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_SITE_URL: ${VITE_SITE_URL:-}
        VITE_GITHUB_CLIENT_ID: ${VITE_GITHUB_CLIENT_ID:-}
        VITE_BRAND_NAME: ${VITE_BRAND_NAME:-Showcase}
        VITE_DEFAULT_LANG: ${VITE_DEFAULT_LANG:-en}
        VITE_LANGS: ${VITE_LANGS:-en,fr,sv}
    volumes:
      - react_build:/usr/src/app/dist

  nginx:
    restart: always
    image: nginx:alpine
    ports:
      - 80:8080
    volumes:
      - ./nginx/nginx-setup.conf:/etc/nginx/conf.d/default.conf:ro
      - react_build:/var/www/react
      - media_data:/var/www/media
      - static_data:/var/www/static
    depends_on:
      - backend
      - frontend

volumes:
  react_build:
  postgres_data:
  media_data:
  static_data:
