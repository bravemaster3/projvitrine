# Plain Docker host (the current droplet): `docker compose -f docker-compose-prod.yaml up -d --build`
# with a .env next to this file. Coolify uses docker-compose.coolify.yaml instead.
services:
  db:
    restart: always
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    restart: always
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
    volumes:
      - media_data:/usr/src/app/media
    depends_on:
      db:
        condition: service_healthy

  web:
    restart: always
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_SITE_URL: ${SITE_URL:-}
        VITE_FRONTEND_URL: ${VITE_FRONTEND_URL:-}
        VITE_GITHUB_CLIENT_ID: ${VITE_GITHUB_CLIENT_ID:-}
        VITE_BRAND_NAME: ${VITE_BRAND_NAME:-Showcase}
        VITE_DEFAULT_LANG: ${VITE_DEFAULT_LANG:-en}
        VITE_LANGS: ${LANGS:-en,fr,sv}
    environment:
      CANONICAL_HOST: ${CANONICAL_HOST:-}
    ports:
      - "80:8080"
    volumes:
      - media_data:/media:ro
    depends_on:
      - backend

# Volume names match the original stack, so existing data is reused in place.
volumes:
  postgres_data:
  media_data:
