# Local Postgres for development and for restoring the production dump.
# Use with DATABASE_URL=postgres://projvitrine:projvitrine@localhost:5433/projvitrine
services:
  db:
    image: postgres:15-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: projvitrine
      POSTGRES_USER: projvitrine
      POSTGRES_PASSWORD: projvitrine
    volumes:
      - dev_postgres:/var/lib/postgresql/data
      - ./backups:/backups

volumes:
  dev_postgres:
