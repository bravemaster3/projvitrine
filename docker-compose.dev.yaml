# Local Postgres for development and for restoring the production dump.
# Use with DATABASE_URL=postgres://showcase:showcase@localhost:5433/showcase
services:
  db:
    image: postgres:15-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: showcase
      POSTGRES_USER: showcase
      POSTGRES_PASSWORD: showcase
    volumes:
      - dev_postgres:/var/lib/postgresql/data
      - ./backups:/backups

volumes:
  dev_postgres:
