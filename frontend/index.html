<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0f766e" />
    <!-- The brand placeholder is filled in when the container starts; /u/* pages get per-page tags from the server. -->
    <title>__BRAND_NAME__</title>
    <meta name="description" content="Portfolios and project case studies by developers and researchers." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="__BRAND_NAME__" />
    <meta property="og:title" content="__BRAND_NAME__" />
    <meta property="og:description" content="Portfolios and project case studies by developers and researchers." />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var mode = localStorage.getItem("theme") || "system"
        var dark = mode === "dark" || (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.dataset.theme = dark ? "dark" : "light"
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Runtime settings (site URL, brand, GitHub client id), written by the web container. -->
    <script src="/config.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
